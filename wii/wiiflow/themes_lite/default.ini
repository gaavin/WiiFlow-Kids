# WiiFlow Kids theme overrides. Loaded as sd:/wiiflow/themes_lite/default.ini
# when [GENERAL] theme=default. Values here beat the compiled defaults.

# Ink is deep navy everywhere it sits on the sky or on a capsule. Sizes are
# a few points up on the stock ones: this is read from a couch by a child,
# not from a desk. Font size caps at 300 (menu.cpp _dfltFont).
[GENERAL]
button_font_color=#122038FF
button_font_size=25
button_font_line_height=25
label_font_color=#F4F7FFFF
title_font_color=#122038FF
title_font_size=28
text_font_color=#122038FF
text_font_size=17
text_font_line_height=23

# The game name above the coverflow — the one label a child actually reads.
[_COVERFLOW]
font_color=#122038FF
font_size=30
font_line_height=32
font_weight=32

[GAME/PLAY_BTN]
x=404
y=336
width=212
height=56
color=#122038FF

[GAME/BACK_BTN]
x=404
y=400
width=212
height=56
color=#122038FF

[GAME/A_GLYPH]
x=412
y=344
width=40
height=40

[GAME/B_GLYPH]
x=412
